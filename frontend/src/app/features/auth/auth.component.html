<ng-container *ngIf="mode$ | async as mode; else load">
  <div class="header">
    <h3 class="header__title">GRIDMIND</h3>
    <p class="header__text">Engineering excellence in prediction</p>
  </div>
  <div *ngIf="mode === 'login'">
    <form [formGroup]="loginForm" (ngSubmit)="loginSubmit()">
      <a routerLink="/"> &lt;- I am not engineer</a>
      <formly-form [form]="loginForm" [fields]="loginFields" [model]="loginModel"></formly-form>
      <!-- errors -->
      <div *ngIf="errorMessage" role="alert" class="error">{{ errorMessage }}</div>
      <button class="btn btn--primary" type="submit">Send</button>
    </form>

    <div class="actions">
      <span>New engineer?</span>
      <a routerLink="/register">CREATE ACCOUNT</a>
    </div>
  </div>
  <div *ngIf="mode === 'register'">
    <form [formGroup]="registerForm" (ngSubmit)="registerSubmit()">
      <a routerLink="/"> &lt;- I am not engineer</a>
      <formly-form
        [form]="stepForms[activeStep]"
        [fields]="stepFields[activeStep]"
        [model]="registerModel"
      ></formly-form>

      <!-- errors -->
      <div *ngIf="errorMessage" role="alert" class="error">{{ errorMessage }}</div>

      <div class="steps-nav">
        <button
          class="btn btn--ghost"
          type="button"
          (click)="prevStep()"
          [disabled]="activeStep === 0"
        >
          Prev
        </button>
        <button
          class="btn btn--primary"
          type="button"
          (click)="nextStep()"
          *ngIf="!isLastStep"
          [disabled]="stepForms[activeStep].invalid"
        >
          Next
        </button>
        <button
          class="btn btn--primary"
          *ngIf="isLastStep"
          type="submit"
          [disabled]="!allStepsValid || loading"
        >
          Create
        </button>
      </div>
    </form>
    <div class="actions">
      <span>You engineer?</span>
      <a routerLink="/login">Let's go</a>
    </div>
  </div>
</ng-container>
<ng-template #load>
  <p>Загрузка...</p>
</ng-template>
