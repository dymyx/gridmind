<app-loader *ngIf="loading" />

<app-upcoming-race [upcomingRace]="upcomingRace" />
<div class="standings">
  <div class="filter">
    <div class="segmented" [attr.data-active]="mode" role="tablist">
      <button
        type="button"
        role="tab"
        class="segmented__item"
        [class.is-active]="mode === 'drivers'"
        [attr.aria-selected]="mode === 'drivers'"
        (click)="switchFilter('drivers')"
      >
        Drivers
      </button>
      <button
        type="button"
        role="tab"
        class="segmented__item"
        [class.is-active]="mode === 'teams'"
        [attr.aria-selected]="mode === 'teams'"
        (click)="switchFilter('teams')"
      >
        Teams
      </button>
    </div>
  </div>

  <app-table [rowData]="tableData" [columns]="tableColumns"></app-table>
</div>
